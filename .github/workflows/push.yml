# Build the Project

name: Build on push

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_call:
    inputs:
      configuration:
        required: false
        type: string
        default: "Debug"

jobs:
  build:
    name: Build app
    runs-on: ubuntu-26.04
    env:
      MINVERBUILDMETADATA: build.${{ github.run_id }}.${{ github.run_attempt}}
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      CONFIGURATION: ${{ inputs.configuration || 'Debug' }}
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        fetch-tags: true
        filter: tree:0
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          10.0.x
          8.0.x
        cache: true
    - name: Restore dependencies
      run: dotnet restore src/JuffMa.Controls.Acrylic/JuffMa.Controls.Acrylic.csproj
    - name: Pack nuget
      run: dotnet pack src/JuffMa.Controls.Acrylic/JuffMa.Controls.Acrylic.csproj -c $env:CONFIGURATION --no-restore -o out
    - name: Upload nuget artifact
      uses: actions/upload-artifact@v7
      with:
        name: nuget
        path: |
          out/*.nupkg
          out/*.snupkg